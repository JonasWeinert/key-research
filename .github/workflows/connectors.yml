# Database search connectors: check every change (schema, engine, recorded fixtures) and, on
# main, publish a bundle that the app downloads on demand (tools/connectors/README.md).
# Signing is optional for now: without the CONNECTORS_SIGNING_KEY secret or a root key in
# connectors/trust.json the bundle is published unsigned (the app accepts and labels it so).
# Once a root is in trust.json the app requires signatures, so publishing then needs the key.
name: connectors

on:
  pull_request:
    paths: ["connectors/**", "crates/key-connectors/**", "tools/connectors/**", ".github/workflows/connectors*.yml"]
  push:
    branches: [main]
    paths: ["connectors/**", "crates/key-connectors/**", "tools/connectors/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connectors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: connectors-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Engine tests
        run: cargo test -p key-connectors --locked
      - name: Validate specs
        run: tools/connectors/validate
      - name: Embedded tests on recorded fixtures
        run: tools/connectors/test --report fixtures-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixtures-report
          path: fixtures-report.json
          if-no-files-found: ignore

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      KEY_CONNECTORS_SIGNING_KEY: ${{ secrets.CONNECTORS_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Signed or unsigned?
        id: setup
        run: |
          root=false; grep -q '"keyId"' connectors/trust.json && root=true
          if [ -n "$KEY_CONNECTORS_SIGNING_KEY" ] && [ "$root" = true ]; then
            echo "Signing with CONNECTORS_SIGNING_KEY."; echo "mode=signed" >> "$GITHUB_OUTPUT"
          elif [ "$root" = true ]; then
            echo "::warning::connectors/trust.json trusts a root key, so the app only accepts signed bundles, but the CONNECTORS_SIGNING_KEY secret is missing: not publishing."
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          else
            echo "No root key in connectors/trust.json: publishing an unsigned bundle."; echo "mode=unsigned" >> "$GITHUB_OUTPUT"
          fi
      - name: Rust toolchain
        if: steps.setup.outputs.mode != 'skip'
        run: rustup show
      - uses: actions/cache@v4
        if: steps.setup.outputs.mode != 'skip'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: connectors-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Bundle, sign when set up, and verify as the app would
        if: steps.setup.outputs.mode != 'skip'
        run: |
          # The run number only grows, so every published bundle is newer than the last.
          tools/connectors/bundle --out dist --sequence "$((100000 + GITHUB_RUN_NUMBER))"
          if [ "${{ steps.setup.outputs.mode }}" = signed ]; then tools/connectors/sign --dir dist; fi
          tools/connectors/verify --dir dist
      - name: Publish to the connectors-dist branch
        if: steps.setup.outputs.mode != 'skip'
        run: |
          cd dist
          git init -q -b connectors-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${{ steps.setup.outputs.mode }} connectors bundle $((100000 + GITHUB_RUN_NUMBER)) from ${GITHUB_SHA::8}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" connectors-dist
