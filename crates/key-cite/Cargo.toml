[package]
name = "key-cite"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Citation engine: Key sources as CSL-JSON, citations and bibliographies rendered with CSL styles"

[dependencies]
# Patched by the vendored copy ([patch.crates-io] in the workspace manifests; the
# patches are vendor/patches/hayagriva). tools/vendor-update.mjs keeps this pin.
hayagriva = { version = "=0.10.1", default-features = false, features = ["csl-json"] }
citationberg = { version = "0.7", features = ["json"] }
key-store = { path = "../key-store" }
serde.workspace = true
serde_json.workspace = true
