[package]
name = "key-desktop-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Key research PDF reader desktop application"

[workspace]
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
http = "1"
tempfile = "3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
unicode-normalization = "0.1"
key-safe-http = { path = "../key-safe-http" }
key-processing = { path = "../key-processing" }
key-library = { path = "../key-library" }
key-pdf-core = { path = "../key-pdf-core" }
key-pdf-runtime = { path = "../key-pdf-runtime" }
key-pdfium = { path = "../key-pdfium" }
key-semantic-search = { path = "../key-semantic-search" }
key-store = { path = "../key-store" }
key-biblio = { path = "../key-biblio" }
key-cite = { path = "../key-cite" }
citationberg = "0.7"
key-embed = { path = "../key-embed" }
key-index = { path = "../key-index" }
key-zotero = { path = "../key-zotero" }
key-reference = { path = "../../extensions/key-reference" }
opendataloader-pdf = { path = "../opendataloader-pdf-rs", default-features = false, features = ["onnx"] }
[features]
semantic-onnx = ["key-semantic-search/semantic-onnx"]
[patch.crates-io]
pdfium-render = { path = "../../vendor/pdfium-render-tile" }

# The bundled SQLite (and its vector extension) does all library filtering, counting and
# search; compile it optimised even in debug builds, which the desktop app ships today.
# The tag manager's analysis and the HTML reference scan run per request.
[profile.dev.package.key-store]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3
[profile.dev.package.sqlite-vec]
opt-level = 3
# Layout analysis runs on every imported PDF.
[profile.dev.package.opendataloader-pdf]
opt-level = 3
[profile.dev.package.pdfium-render]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
